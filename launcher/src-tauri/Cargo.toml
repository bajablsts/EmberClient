[package]
name = "ember-launcher"
version = "0.1.0"
description = "Ember desktop launcher"
authors = ["Ember contributors"]
edition = "2021"

[lib]
name = "ember_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
